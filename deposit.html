<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/style.css">
  
  <title>Wallet - Depositar</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <style>
    body {
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
  <h2>Depositar</h2>

  <p>Saldo actual: <strong id="balance">$60.000</strong></p>

  <div class="container">
  <h2>Enviar Dinero</h2>

  <p>Saldo actual: <strong id="balance">$60.000</strong></p>

  <div id="message"></div>

  <form id="sendMoneyForm">
    <div class="form-group">
      <label for="searchContact">Buscar en la agenda de transferencias:</label>
      <input 
        type="text" 
        class="form-control" 
        id="searchContact" 
        placeholder="Buscar contacto"
        required
      >
    </div>

    <div class="form-group">
      <label for="sendAmount">Monto a enviar:</label>
      <input 
        type="number" 
        class="form-control" 
        id="sendAmount" 
        placeholder="Ingrese monto"
        required
      >
    </div>

    <button type="button" id="addContactBtn" class="btn btn-outline-primary btn-block">
      Agregar nuevo contacto
    </button>

    <button type="submit" class="btn btn-primary btn-block mt-2">
      Enviar dinero
    </button>
  </form>

  <h3 class="mt-4">Contactos</h3>

  <ul id="contactList" class="list-group"></ul>

  <a href="menu.html" class="btn btn-secondary btn-block mt-3">
    Volver al Menú Principal
  </a>
</div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
