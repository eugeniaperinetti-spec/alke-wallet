<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Depositar fondos | Alke Wallet</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="menu.html">
                    Alke Wallet
                </a>
            </div>
        </nav>
    </header>

    <main class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-12 col-md-7 col-lg-5">

                <section class="card shadow">

                    <div class="card-body">

                        <h1 class="h3 text-center mb-4">
                            Depositar fondos
                        </h1>

                        <div class="text-center mb-4">

                            <p class="mb-1">
                                Saldo disponible
                            </p>

                            <p
                                id="balance"
                                class="h2 font-weight-bold text-primary"
                            >
                                $0
                            </p>

                        </div>

                        <div
                            id="message"
                            class="mb-3"
                            aria-live="polite"
                        ></div>

                        <form id="depositForm">

                            <div class="form-group">

                                <label for="depositAmount">
                                    Monto a depositar
                                </label>

                                <input
                                    type="number"
                                    id="depositAmount"
                                    class="form-control"
                                    placeholder="Ejemplo: 10000"
                                    min="1"
                                    step="1"
                                    required
                                >

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success btn-block"
                            >
                                Realizar depósito
                            </button>

                        </form>

                        <a
                            href="menu.html"
                            class="btn btn-outline-secondary btn-block mt-3"
                        >
                            Volver al menú
                        </a>

                    </div>

                </section>

            </div>

        </div>

    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JavaScript propio -->
    <script src="assets/js/app.js"></script>

</body>
</html>
