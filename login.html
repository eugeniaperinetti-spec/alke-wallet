<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | Alke Wallet</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    Alke Wallet
                </a>
            </div>
        </nav>
    </header>

    <main class="container">

        <section class="mx-auto mt-5" style="max-width: 450px;">

            <div class="card shadow">

                <div class="card-body">

                    <h1 class="h3 text-center mb-4">
                        Iniciar sesión
                    </h1>

                    <div
                        id="message"
                        class="mb-3"
                        aria-live="polite"
                    ></div>

                    <form id="loginForm">

                        <div class="form-group">
                            <label for="email">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="usuario@alke.cl"
                                required
                                autocomplete="email"
                            >
                        </div>

                        <div class="form-group">
                            <label for="password">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Ingresa tu contraseña"
                                required
                                minlength="4"
                                autocomplete="current-password"
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-block"
                        >
                            Iniciar sesión
                        </button>

                    </form>

                    <a
                        href="index.html"
                        class="btn btn-outline-secondary btn-block mt-3"
                    >
                        Volver
                    </a>

                </div>

            </div>

        </section>

    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JavaScript propio -->
    <script src="assets/js/app.js"></script>

</body>
</html>
